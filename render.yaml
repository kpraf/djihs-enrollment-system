# Render Blueprint: creates the web app and its Postgres database together.
# In the Render dashboard choose New > Blueprint and select this repository.
databases:
  - name: djihs-db
    databaseName: djihs_enrollment
    user: djihs
    region: singapore
    # Paid plans: a free database is deleted after 30 days and has no
    # backups, and a workspace can have only one.
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: djihs-enrollment
    runtime: docker
    region: singapore
    plan: starter
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: DJIHS Enrollment
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Render generates a random key once and keeps it across deploys.
      - key: APP_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: djihs-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_LIFETIME
        value: "30"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: ADMIN_USERNAME
        value: admin
      # Demo accounts (demo.registrar, demo.adviser, ... all with password
      # "password") and 120 fake learners, for trying the system out.
      # Set to "false" before real learner data goes in: the next deploy then
      # switches the demo accounts off. Start real use on a fresh database
      # so the fake learners are not mixed with real ones.
      - key: DEMO_DATA
        value: "true"
      # The school's Data Protection Officer, shown on the privacy notice.
      - key: PRIVACY_DPO_NAME
        sync: false
      - key: PRIVACY_DPO_EMAIL
        sync: false
      - key: PRIVACY_DPO_PHONE
        sync: false
      # Leave blank to have a password generated and printed in the deploy
      # logs. Either way it must be changed at first sign-in.
      - key: ADMIN_PASSWORD
        sync: false
