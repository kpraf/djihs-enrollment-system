<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Basic hardening for a site that holds learner records.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000"
    ServerSignature Off

    # Browser caching. Built JavaScript, CSS and fonts get a new file name
    # whenever they change, so browsers may keep them for a year. Pages and
    # their data are never cached: Laravel marks them no-cache, private.
    <LocationMatch "^/build/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # Logos, icons and the sign-in photo for a week. The favicon and photo
    # links carry ?v=..., which changes when the file does.
    <LocationMatch "^/(images/|favicon|apple-touch-icon|icon-|site\.webmanifest)">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
