   </g>
   <g id="text_18">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="280.8" y="580.697344" transform="rotate(-0 280.8 580.697344)">MySQL, 14 tables</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="871.2" y="580.697344" transform="rotate(-0 871.2 580.697344)">PostgreSQL or SQLite, 10 tables (see diagram 6)</text>
