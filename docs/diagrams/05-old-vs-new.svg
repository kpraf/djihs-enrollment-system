   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="32.4" y="50.437031" transform="rotate(-0 32.4 50.437031)">5. What changed: the old system and the new one</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6472" x="32.4" y="78.918281" transform="rotate(-0 32.4 78.918281)">Same school workflows and the same look; rebuilt so the rules are enforced on the server.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #9a3412" x="280.8" y="118.8" transform="rotate(-0 280.8 118.8)">Old system (HTML, CSS, JavaScript, PHP)</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0a4d1c" x="871.2" y="118.8" transform="rotate(-0 871.2 118.8)">New system (Laravel, React, TypeScript)</text>
   </g>
   <g id="text_5">
    <g id="patch_20">
