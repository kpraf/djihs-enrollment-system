   </g>
   <g id="text_15">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="280.8" y="485.657344" transform="rotate(-0 280.8 485.657344)">Not handled: duplicates and overwrites possible</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(706.381992 479.094844)">Unique keys, row locks and version checks: one save wins, the</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(827.224688 492.219844)">other is told why</text>
   </g>
