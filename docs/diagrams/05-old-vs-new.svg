   </g>
   <g id="text_21">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="280.8" y="675.737344" transform="rotate(-0 280.8 675.737344)">No privacy notice or access log</text>
   </g>
   <g id="text_22">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(723.564258 669.174844)">Privacy notice, staff agreement, view and download log,</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(817.123359 683.317031)">Learner Data Record</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2937" x="43.2" y="759.6" transform="rotate(-0 43.2 759.6)">Added that the old system didn't have:</text>
   </g>
   <g id="text_24">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5b6472" transform="translate(43.2 788.766846)">importing the school's workbook · LRN lookup while typing · adjustable text size · one Reports page with year-on-year change · document checklist · revision requests ·</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5b6472" transform="translate(43.2 800.169443)">CSV and Excel everywhere · runs on Render or a school computer</text>
   </g>
  </g>
 </g>
