    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="576" y="160.997656" transform="rotate(-0 576 160.997656)">Pages</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="280.8" y="200.537344" transform="rotate(-0 280.8 200.537344)">A separate HTML page per role and task (about 30)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(698.493867 193.974844)">One app; each role gets its own menu and pages, checked on the</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(854.580469 207.067852)">server</text>
   </g>
   <g id="text_8">
    <g id="patch_21">
