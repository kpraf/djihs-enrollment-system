    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="576" y="256.038047" transform="rotate(-0 576 256.038047)">Signing in</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(125.868398 289.014844)">Login state and role kept in the browser (localStorage) and</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(222.957305 302.139844)">checked by JavaScript</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(721.869492 289.014844)">Server sessions; every page and action checks the role's</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(786.004805 302.139844)">abilities; 30-minute idle sign-out</text>
   </g>
