   </g>
   <g id="text_12">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="280.8" y="391.634531" transform="rotate(-0 280.8 391.634531)">28 hand-written PHP API files</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(713.499844 384.536367)">Controllers, services and validation; tested with 145 feature</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(801.329883 398.197031)">tests and 43 browser tests</text>
   </g>
